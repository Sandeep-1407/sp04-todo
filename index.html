<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120f3e">
<title>SP04 · Daily Organizer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0e0b36;--bg2:#17124a;--card:#1d1858;--card2:#262070;--gold:#e8be5c;--gold2:#f6d98b;--text:#f4f0ff;--muted:#b8b0dc;--line:rgba(255,255,255,.12);--red:#ff7a8a;--green:#6fe0a8;--blue:#8ab4ff;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#3a2390 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#1f2f86 0%,transparent 55%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
a{color:var(--gold2)}
/* top bar */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(14,11,54,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:19px;flex:none}
header.top h1{margin:0;font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top h1 small{display:block;font-size:11px;color:var(--gold);font-weight:600;letter-spacing:.06em}
/* drawer */
#drawer{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;background:linear-gradient(180deg,#1b1557,#100c3c);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
.brand{display:flex;gap:12px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.brand img{width:44px;height:44px;border-radius:12px}
.brand b{font-size:18px;color:var(--gold2)}.brand small{display:block;color:var(--muted);font-size:12px}
#menu{flex:1;overflow:auto;padding:8px}
#menu a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--text);font-weight:500;margin:2px 0}
#menu a span:first-child{width:26px;text-align:center;font-size:19px}
#menu a.on{background:linear-gradient(135deg,rgba(246,217,139,.22),rgba(232,190,92,.08));color:var(--gold2);box-shadow:inset 3px 0 0 var(--gold)}
.drawer-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media(min-width:960px){#drawer{transform:none}#scrim{display:none!important}#menuBtn{display:none}main,header.top{margin-left:270px}}
main{padding:14px;padding-bottom:110px;max-width:1100px}
@media(min-width:960px){main{padding:20px 28px 110px}}
/* common ui */
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--gold2);display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{color:var(--muted);display:block;font-size:12px}.stat b{font-size:20px;display:block;margin-top:2px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#24104f;box-shadow:0 6px 18px rgba(232,190,92,.25)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.btn.red{background:rgba(255,122,138,.15);color:var(--red);border:1px solid rgba(255,122,138,.35)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:7px 13px;font-size:13px}
.chip.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#24104f;border-color:transparent;font-weight:700}
input.f,select.f,textarea.f{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--gold)}
select.f option{color:#000}
label.l{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.muted{color:var(--muted)}.small{font-size:12px}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:18px;flex:none}
.list .it .tx{flex:1;min-width:0}
.list .it .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .tx small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}.amt.out{color:var(--red)}.amt.in{color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty div{font-size:40px;margin-bottom:6px}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:15;width:58px;height:58px;border-radius:18px;border:0;font-size:28px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#24104f;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.datehead{font-size:12px;color:var(--gold);font-weight:700;margin:14px 2px 4px;display:flex;justify-content:space-between}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.search{position:relative}.search input{padding-left:36px}.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7}
/* sheet (bottom modal) */
#modal{position:fixed;inset:0;z-index:95;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
#modal .box{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#221b66,#15104a);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){#modal{align-items:center}#modal .box{border-radius:22px}}
#modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#modal .mh b{flex:1;font-size:17px;color:var(--gold2)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2380;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;z-index:97;max-width:90vw;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.5)}
/* lock screen */
#lock{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(800px 500px at 50% 0%,#3a2390,transparent 70%),var(--bg)}
#lock img{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#lock h2{margin:14px 0 4px;color:var(--gold2)}
#lock p{color:var(--muted);margin:0 0 14px;max-width:340px}
.dots{display:flex;gap:12px;margin:10px 0 18px;min-height:18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);display:block}
.dots i.f{background:var(--gold)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.keypad button{height:62px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:24px;font-weight:600}
.keypad button:active{background:rgba(232,190,92,.25)}
.lockmsg{min-height:22px;color:var(--red);font-size:14px;margin-top:10px}
.warnbox{background:rgba(255,122,138,.1);border:1px solid rgba(255,122,138,.4);border-radius:12px;padding:10px 12px;font-size:13px;text-align:left;max-width:340px;margin-bottom:12px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1/1;min-height:40px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;position:relative}
.cal .d.o{opacity:.3}
.cal .d.t{border-color:var(--gold);color:var(--gold2)}
.cal .d.s{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#24104f}
.cal .d .mk{display:flex;gap:2px;position:absolute;bottom:5px}
.cal .d .mk i{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.cal .d .mk i.e{background:var(--red)}.cal .d .mk i.n{background:var(--blue)}
.cal .d.s .mk i{background:#24104f}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--gold);flex:none;display:grid;place-items:center;background:transparent;font-size:15px;color:#24104f;margin-top:1px}
.tick.on{background:var(--gold)}
.task.done .tx b{text-decoration:line-through;opacity:.55}
.pri{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.pri.p2{background:var(--red)}.pri.p1{background:var(--gold)}.pri.p0{background:var(--green)}
/* notes */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.nc{border-radius:16px;padding:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);min-height:110px;cursor:pointer;overflow:hidden;position:relative}
.nc b{display:block;margin-bottom:4px;font-size:14px}
.nc p{margin:0;color:var(--muted);font-size:12.5px;max-height:84px;overflow:hidden;white-space:pre-line}
.nc .ty{position:absolute;right:8px;top:8px;font-size:14px;opacity:.85}
.nc img{width:100%;height:80px;object-fit:cover;border-radius:10px;margin-top:6px}
.tb{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:61px;z-index:5;background:rgba(14,11,54,.95);padding:6px 0;border-bottom:1px solid var(--line)}
.tb button{min-width:38px;height:36px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-weight:700;font-size:14px;padding:0 8px}
.ed{min-height:55vh;outline:none;padding:12px 4px;font-size:16px;line-height:1.6}
.ed:empty::before{content:attr(data-ph);color:var(--muted)}
.ed img{max-width:100%;border-radius:12px;display:block;margin:8px 0}
.ed h1{font-size:24px;color:var(--gold2);margin:8px 0}.ed h2{font-size:19px;color:var(--gold2);margin:8px 0}
.ed blockquote{border-left:3px solid var(--gold);margin:8px 0;padding-left:12px;color:var(--muted)}
.titlein{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);font-size:20px;font-weight:700;padding:10px 2px;outline:none}
.calc{font-family:ui-monospace,Menlo,Consolas,monospace}
.calcrow{display:flex;align-items:stretch;border-bottom:1px solid rgba(255,255,255,.06)}
.calcrow input{flex:1;min-width:0;background:transparent;border:0;outline:none;padding:9px 4px;font-size:16px}
.calcrow .res{min-width:90px;text-align:right;padding:9px 6px;color:var(--gold2);font-weight:700}
.calctotal{display:flex;justify-content:space-between;padding:12px 6px;font-size:18px;font-weight:800;color:var(--gold2);border-top:2px solid var(--gold);margin-top:6px}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0}
.chk input[type=text]{flex:1;background:transparent;border:0;border-bottom:1px solid var(--line);padding:7px 2px;outline:none}
.chk.done input[type=text]{text-decoration:line-through;opacity:.55}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{font-size:24px;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.moods button.on{border-color:var(--gold);background:rgba(232,190,92,.2)}
/* spreadsheet */
.sbar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.sbar .ref{width:56px;text-align:center;font-weight:700;color:var(--gold2);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 4px}
.sbar input{flex:1}
.swrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:12px;background:#120e40}
table.ss{border-collapse:collapse;font-size:14px}
table.ss th{position:sticky;top:0;background:#2a2378;color:var(--gold2);font-weight:600;min-width:96px;padding:6px;border:1px solid rgba(255,255,255,.1);z-index:2}
table.ss th.rh{position:sticky;left:0;min-width:40px;z-index:3}
table.ss td.rh{position:sticky;left:0;background:#2a2378;color:var(--gold2);text-align:center;font-weight:600;z-index:1;min-width:40px}
table.ss td{border:1px solid rgba(255,255,255,.1);padding:0;height:32px;min-width:96px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.ss td .v{padding:6px 7px;display:block;min-height:31px}
table.ss td.num .v{text-align:right}
table.ss td.sel{outline:2px solid var(--gold);outline-offset:-2px;background:rgba(232,190,92,.12)}
table.ss td.err .v{color:var(--red)}
table.ss td input{width:100%;height:31px;border:0;outline:none;background:#fff;color:#111;padding:0 6px}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
/* vault & locker */
.pw{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px}
.pgrid .ph{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.06);position:relative;cursor:pointer}
.pgrid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .ph.sel::after{content:"✓";position:absolute;inset:0;background:rgba(232,190,92,.45);display:grid;place-items:center;font-size:34px;font-weight:800;color:#24104f}
#viewer{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column}
#viewer .vt{display:flex;gap:8px;align-items:center;padding:10px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(0,0,0,.6)}
#viewer .vt span{flex:1;color:#ddd;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer .vi{flex:1;display:grid;place-items:center;overflow:hidden;touch-action:pan-y}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
.banner{background:rgba(232,190,92,.1);border:1px solid var(--gold);border-radius:14px;padding:11px 13px;font-size:13.5px;margin-bottom:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle small{display:block;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="lock"></div>
<div id="app" class="hidden">
  <header class="top">
    <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
    <h1><small>SP04</small><span id="pageTitle">Home</span></h1>
    <span id="topActions" class="row"></span>
    <button class="iconbtn" id="lockBtn" aria-label="Lock">🔒</button>
  </header>
  <div id="scrim" class="hidden"></div>
  <nav id="drawer">
    <div class="brand"><img src="icon-192.png" alt=""><div><b>SP04</b><small id="brandSub">Daily Organizer</small></div></div>
    <div id="menu"></div>
    <div class="drawer-foot" id="drawerFoot"></div>
  </nav>
  <main id="page"></main>
</div>
<div id="modal" class="hidden"><div class="box"></div></div>
<div id="toast" class="hidden"></div>
<input type="file" id="filePick" hidden>
<script src="core.js"></script>
<script src="pages-a.js"></script>
<script src="pages-b.js"></script>
<script src="pages-c.js"></script>
</body>
</html>
